services:
  clickhouse:
    build:
      context: ./infra
      dockerfile: Containerfile
    container_name: ulpf-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ulpf_raw}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ulpf-net

  core-engine:
    build:
      context: ./core-engine
      dockerfile: Containerfile
    container_name: ulpf-core-engine
    ports:
      - "8080:8080"
    environment:
      - SQLITE_DB_PATH=/app/data/control-plane.db
      - CLICKHOUSE_URL=http://clickhouse:8123
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-for-dev-environment-12345}
      - API_KEY_HASH_SALT=${API_KEY_HASH_SALT:-dev-salt-key-12345}
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/v1/notifications || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - ulpf-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: ulpf-frontend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      core-engine:
        condition: service_healthy
    networks:
      - ulpf-net

volumes:
  clickhouse-data:
  sqlite-data:

networks:
  ulpf-net:
    driver: bridge
