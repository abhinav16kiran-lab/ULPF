spring:
  profiles:
    active: dev
  application:
    name: core-engine
  datasource:
    url: jdbc:sqlite:${SQLITE_DB_PATH:./data/control-plane.db}?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:sqlite/schema.sql

server:
  port: ${CORE_ENGINE_PORT:8080}



# Mapping engine configuration
mapping:
  confidence-threshold: 0.60
  gap-threshold: 0.20
  hybrid-acceptance-threshold: 0.50
  model:
    path: models/all-MiniLM-L6-v2/model.onnx
    idle-timeout-ms: 180000

# ClickHouse storage configuration
clickhouse:
  datasource:
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/ulpf_raw}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}

