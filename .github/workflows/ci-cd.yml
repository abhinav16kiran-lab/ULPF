name: ULPF CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/*"
      - "ci-cd-implementation"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: Test Backend Core Engine
  # ---------------------------------------------------------------------------
  test-backend:
    name: Build & Test Core Engine (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run Unit & Integration Tests
        run: |
          cd core-engine
          mvn clean test -DJWT_SECRET="test-secret-key-1234567890"


  # ---------------------------------------------------------------------------
  # JOB 2: Build Frontend
  # ---------------------------------------------------------------------------
  test-frontend:
    name: Build & Verify Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 21
        uses: actions/setup-node@v5
        with:
          node-version: "21"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build


  # ---------------------------------------------------------------------------
  # JOB 3: Build & Publish Container Images to GHCR
  # Main Branch Only
  # ---------------------------------------------------------------------------
  publish-containers:
    name: Build & Push Container Images (GHCR)
    needs:
      - test-backend
      - test-frontend

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Core Engine Container
      - name: Build & Push Core Engine Image
        uses: docker/build-push-action@v6
        with:
          context: ./core-engine
          file: ./core-engine/Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/core-engine:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/core-engine:${{ github.sha }}

      # Build & Push Frontend Container
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
